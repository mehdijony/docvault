# infrastructure/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "docvault-api"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: "/metrics"

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: "/metrics"

  - job_name: "minio"
    metrics_path: "/minio/v2/metrics/cluster"
    scheme: http
    authorization:
      credentials: "minioadmin"
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: "/metrics"

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: "/metrics"

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    metrics_path: "/metrics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
